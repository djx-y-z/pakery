[alias]
# Sanity-check that all user-facing crates compile cleanly to
# wasm32-unknown-unknown. Downstream users always bring their own RNG: since
# 0.4.0 no published crate depends on a generator at all, only on rand_core's
# `CryptoRng` bound. Excludes `pakery-tests`, which links `getrandom` for its
# `SysRng`-driven RFC vectors.
wasm-check = [
    "check",
    "-p", "pakery-core",
    "-p", "pakery-cpace",
    "-p", "pakery-opaque",
    "-p", "pakery-spake2",
    "-p", "pakery-spake2plus",
    "-p", "pakery-crypto",
    "--target", "wasm32-unknown-unknown",
    "--no-default-features",
]
