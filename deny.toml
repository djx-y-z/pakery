# cargo-deny configuration (see SECURITY_TESTING.md, "Baseline").
#
# Standard supply-chain hygiene for a published cryptographic library: catches
# new advisories on direct and transitive dependencies, license drift, and
# dependencies pulled from anywhere other than crates.io.
#
# The crate graph is deliberately split across two invocations, so a plain
# `cargo deny check` FAILS the bans check by design. Run — and CI runs
# (audit.yml) — exactly these two:
#
#     cargo deny --all-features check advisories licenses sources
#     cargo deny --all-features --exclude-unpublished check bans
#
# `--exclude-unpublished` drops `publish = false` workspace members as graph
# roots, leaving the dependency trees consumers actually get, which is what
# `[bans]` below is about. The other three checks want the opposite: today
# that flag would take 38 of 114 crates — the whole previous RustCrypto wave,
# where an advisory is most likely to land — out of advisory, licence and
# source scope.
#
# Schema and both spellings verified on cargo-deny 0.19.4 and on 0.20.2, the
# version cargo-deny-action@v2 pins.

[graph]
# Match what the CI test/check jobs actually compile. Without this, the
# optional `p256` / `argon2` / `differential` trees are never inspected — and
# `p256` in particular is where elliptic-curve 0.14 and its transitive set
# enter the graph. It matters for `[bans]` too — a duplicate that only a
# non-default feature pulls in is invisible without it — which is why
# audit.yml passes `--all-features` on both steps as well. That redundancy is
# deliberate: measured on a feature-gated duplicate, the key alone catches it
# and the flag alone catches it; only deleting both makes it invisible.
all-features = true
# One version is taken out of the graph: elliptic-curve 0.13.8, with the seven
# crates only it pulls in. Among them is crypto-bigint 0.5.5, which
# RUSTSEC-2026-0387 covers and which has no fixed 0.5 release (the fix is
# 0.7.6). Like the rest of the previous RustCrypto wave, it is reached only
# through `pakery-tests` (publish = false), whose differential suite runs it
# as the other implementation; nothing published links it. Excluding the
# version, not ignoring the advisory, keeps RUSTSEC-2026-0387 an error for
# the crypto-bigint 0.7 line that the published crates do pull in. The pin is
# exact on purpose: any change to that line brings it back into the graph and
# the advisory back with it. cargo-audit (audit.yml) still scans the excluded
# crates for every other advisory.
exclude = ["elliptic-curve@0.13.8"]

[advisories]
# 0.16+ denies vulnerabilities, unmaintained, unsound and yanked by default;
# there is no severity threshold knob any more. Nothing is ignored, and an
# empty list is a deliberate statement rather than an oversight: the one
# accepted advisory is handled by `[graph] exclude` above, which drops the
# affected test-only version instead of silencing the advisory for every
# version. Add entries here only with a comment explaining why the advisory
# does not apply.
ignore = []

[licenses]
# The project is `MIT OR Apache-2.0`; this is the set its dependency tree
# actually resolves to (RustCrypto, curve25519-dalek, and their transitive
# deps). All are permissive and compatible with both of our own licences.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# `deny`, on the pruned graph described at the top of this file. The full
# graph legitimately carries the previous RustCrypto wave: `pakery-tests`
# (publish = false) pins it under renamed aliases so the opaque-ke v4
# differential suite keeps compiling, and nothing it pulls reaches a published
# crate. Pruning the graph is not the same as relaxing the check — a duplicate
# that reaches a published crate is still an error even when the same version
# is also reachable from `pakery-tests`.
#
# `skip-tree` on the non-published roots was measured and rejected for failing
# exactly there: it marks a version skipped wherever it appears, so an
# `hmac 0.12` added to `pakery-crypto` passes it with exit 0.
multiple-versions = "deny"
# The only duplicate left in the published graph. bindgen 0.73.2 builds with
# syn 3 (and prettyplease 0.3), while curve25519-dalek-derive and
# zeroize_derive still use syn 2; bindgen is a build-dependency of crabgrind,
# which `all-features` reaches through pakery-core's private `__ctgrind`
# feature and which no compiled artifact links. Pinned to the exact version on
# purpose: should bindgen move off syn 3.0.5 the skip stops matching, and
# should syn 2 leave the published graph it stops being needed, after which a
# new syn 2 user would pass as a skipped duplicate. audit.yml runs the check
# with `-D unmatched-skip -D unnecessary-skip`, so either case fails it rather
# than quietly absorbing the change; without the flags cargo-deny only warns.
skip = [
    { crate = "syn@3.0.5", reason = "bindgen <- crabgrind build-dep, never linked" },
]
# A `*` version requirement in a published crate is never intentional here.
# Evaluated on the pruned graph, which is what that sentence always meant.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
