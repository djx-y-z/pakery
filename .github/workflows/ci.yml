name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --all-features --no-deps

  # Documentation gate. The Markdown docs make claims that nothing else in CI
  # compiles or compares: Cargo feature tables, install snippets, the stated
  # MSRV, and the examples themselves. Three doc regressions shipped in a row
  # before this job existed — the `getrandom` feature renamed to `os_rng` in
  # 0.2.0 but still documented in all seven READMEs, install snippets left on
  # `pakery-* = "0.1"` through all of 0.2.x (cargo treats 0.1 and 0.3 as
  # incompatible, so copy-paste silently installed a two-minor-old release),
  # and a `rand_core::OsRng` example that stopped compiling when rand_core 0.9
  # made `OsRng` `TryRngCore`-only. All three were found by hand, none by CI.
  #
  # The example check is the strong one: it builds AND RUNS each ```rust block
  # as a standalone crate whose Cargo.toml is the ```toml block the README
  # itself shows, so an omitted dependency or feature fails here. `pakery-*`
  # deps are redirected to this checkout via `path` while keeping the declared
  # `version`, so a stale version requirement is rejected too. See
  # ci/check-docs.py.
  docs-check:
    name: Docs match code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 ci/check-docs.py

  # `--all-features` is deliberate: `cargo check --workspace` alone skips every
  # non-default optional feature, so a published, user-reachable feature could
  # silently outrun the declared `rust-version` (argon2 0.6 is edition 2024 /
  # MSRV 1.85 and is an optional feature of pakery-crypto — under a bare
  # `--workspace` check this job would never compile it).
  #
  # `--exclude pakery-tests` is equally deliberate: this gate protects
  # *published* crates, and pakery-tests is publish = false. Including it drags
  # opaque-ke (rust-version 1.85, zero headroom), voprf and the whole previous
  # RustCrypto wave into the gate, so an opaque-ke patch release raising its
  # MSRV would redden this job while no published crate is affected. Nothing is
  # lost: every optional feature is declared on the published crate itself
  # (pakery-tests' `argon2` is a pass-through to `pakery-crypto/argon2`).
  # `cargo check` also does not build dev-dependencies, so proptest stays
  # invisible here either way.
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - run: cargo check --workspace --exclude pakery-tests --all-features

  # Scoped Miri (roadmap item 7, crypto-bigint pattern): pakery-core only —
  # protocol crates pull curve25519-dalek, which is impractically slow under
  # Miri. Default features only: the private `__ctgrind` feature would emit
  # Valgrind client requests Miri cannot interpret. Nightly is pinned so Miri
  # behavior changes only deliberately; bump it consciously.
  miri:
    name: Miri (pakery-core)
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-04
          components: miri
      - run: cargo miri setup
      - run: cargo miri test -p pakery-core --lib

  no-std:
    name: no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo check -p pakery-core --target thumbv7em-none-eabihf --no-default-features
      - run: cargo check -p pakery-cpace --target thumbv7em-none-eabihf --no-default-features
      - run: cargo check -p pakery-opaque --target thumbv7em-none-eabihf --no-default-features
      - run: cargo check -p pakery-spake2 --target thumbv7em-none-eabihf --no-default-features
      - run: cargo check -p pakery-spake2plus --target thumbv7em-none-eabihf --no-default-features

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p pakery-core --target wasm32-unknown-unknown
      - run: cargo check -p pakery-cpace --target wasm32-unknown-unknown
      - run: cargo check -p pakery-opaque --target wasm32-unknown-unknown
      - run: cargo check -p pakery-spake2 --target wasm32-unknown-unknown
      - run: cargo check -p pakery-spake2plus --target wasm32-unknown-unknown
      - run: cargo check -p pakery-crypto --target wasm32-unknown-unknown

  feature-combinations:
    name: Feature combinations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ristretto255
          - p256
          - argon2,ristretto255
          - ristretto255,p256
          - ristretto255,p256,argon2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p pakery-crypto --no-default-features --features ${{ matrix.features }}

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +nightly update -Z minimal-versions
      - run: cargo +stable check --workspace --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        id: coverage
        run: |
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
          COVERAGE=$(cargo llvm-cov report --json | jq '.data[0].totals.lines.percent * 10 | round / 10')
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
    outputs:
      percentage: ${{ steps.coverage.outputs.percentage }}

  update-badge:
    name: Update coverage badge
    needs: coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage.json
          label: coverage
          message: ${{ needs.coverage.outputs.percentage }}%
          valColorRange: ${{ needs.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 90
