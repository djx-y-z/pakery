name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run full CI before publishing
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    needs: ci
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "ERROR: Tag v$TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "Publishing version $TAG"

      # Before the publish step, deliberately: crates.io cannot be undone,
      # only yanked. ci/release-notes.py exits non-zero if the tag has no
      # CHANGELOG section, and under `bash -e` that fails the job here --
      # while failing still means something -- rather than after six crates
      # are already on the registry.
      - name: Verify the tag has release notes
        run: python3 ci/release-notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Publish crates
        run: |
          publish() {
            local crate=$1
            echo "Publishing $crate..."
            if OUTPUT=$(cargo publish -p "$crate" 2>&1); then
              echo "$OUTPUT"
              echo "$crate published successfully"
            elif echo "$OUTPUT" | grep -qE "already uploaded|already exists"; then
              echo "$crate already published, skipping"
            else
              echo "$OUTPUT" >&2
              exit 1
            fi
            sleep 30
          }

          publish pakery-core
          publish pakery-cpace
          publish pakery-opaque
          publish pakery-spake2
          publish pakery-spake2plus
          publish pakery-crypto
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Not `--generate-notes`: it summarises the pull requests merged since
      # the previous tag, and a release commit pushed straight to `main` has
      # none. v0.2.1 and v0.3.1 both shipped a couple of hundred characters
      # crediting an unrelated PR and saying nothing about the release. The
      # CHANGELOG entry already is the release note; it was extracted and
      # validated above, before anything was published.
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
