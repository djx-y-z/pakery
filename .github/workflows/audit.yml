name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Complements `cargo audit` (advisories only) with license, source and
  # duplicate-version checks — see deny.toml, which carries the rationale for
  # each gate. Runs on the root workspace; `fuzz/` and `dudect/` are separate
  # workspaces excluded from it by design and are covered by the scheduled
  # `cargo audit` above.
  #
  # Two invocations on purpose, for two different graphs — deny.toml carries
  # the reasoning. Advisories, licences and sources want every crate cargo
  # resolves; the duplicate-version gate wants only what a published crate
  # pulls in, which is what `--exclude-unpublished` leaves. Keep `arguments`
  # spelled out on both steps: the action defaults it to `--all-features`, so
  # setting it on one step and not the other would silently make them differ.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Advisories, licences and sources (full graph)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories licenses sources
      - name: Duplicate versions (published graph only)
        # Runs even if the step above failed. `main` carries no required
        # status checks, so a step that never ran is a gate that silently
        # reports nothing — a standing advisory would otherwise mask this
        # one for weeks, the Monday cron included.
        if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --exclude-unpublished
          command-arguments: bans
