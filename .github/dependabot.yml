version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      # Coupled RustCrypto wave. These crates share transitive constraints
      # (digest / elliptic-curve / crypto-common), so a partial bump either
      # fails to resolve or silently duplicates a version in published trees.
      # Never merge partial bumps of these individually — land the group as
      # one release, the way the digest-0.11 / elliptic-curve-0.14 wave was.
      #
      # `group`, `ff` and `generic-array` were dropped from this list when
      # they stopped being direct dependencies; they now arrive only
      # transitively via elliptic-curve. `zeroize` / `zeroize_derive` are here
      # because zeroize_derive pins an exact zeroize version, so the two must
      # move together.
      crypto-stack:
        patterns:
          - "digest"
          - "sha2"
          - "hmac"
          - "hkdf"
          - "curve25519-dalek"
          - "p256"
          - "argon2"
          - "blake2"
          - "password-hash"
          - "elliptic-curve"
          - "hash2curve"
          - "crypto-common"
          - "zeroize"
          - "zeroize_derive"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci
    commit-message:
      prefix: "ci"
    groups:
      # One PR for all action bumps instead of one per action.
      github-actions:
        patterns:
          - "*"
