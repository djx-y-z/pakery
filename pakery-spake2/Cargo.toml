[package]
name = "pakery-spake2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SPAKE2 balanced PAKE protocol (RFC 9382)"
readme = "README.md"
documentation = "https://docs.rs/pakery-spake2"
keywords = ["pake", "spake2", "password", "key-exchange", "no-std"]
categories = ["cryptography", "no-std", "authentication"]

# docs.rs renders default features only unless told otherwise. Without this,
# every optional item is missing from the rendered documentation while the
# README documents it.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["pakery-core/std"]
os_rng = ["rand_core/os_rng"]
test-utils = []

[dependencies]
pakery-core = { workspace = true }
rand_core = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
