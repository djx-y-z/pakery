[workspace]
resolver = "2"
members = ["pakery-core", "pakery-cpace", "pakery-crypto", "pakery-opaque", "pakery-spake2", "pakery-spake2plus", "pakery-tests"]
# fuzz/ and dudect/ are their own workspaces (nightly-only cargo-fuzz harness;
# dudect-bencher advisory timing harness on a clap 2-era tree); keeping them
# out of the root workspace shields the MSRV / no_std / minimal-versions / wasm
# CI jobs from their dependencies.
exclude = ["fuzz", "dudect"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/djx-y-z/pakery"
authors = ["pakery contributors"]

[workspace.dependencies]
pakery-core = { version = "0.5.0", path = "pakery-core", default-features = false }
pakery-cpace = { version = "0.5.0", path = "pakery-cpace" }
pakery-opaque = { version = "0.5.0", path = "pakery-opaque" }
pakery-spake2 = { version = "0.5.0", path = "pakery-spake2" }
pakery-spake2plus = { version = "0.5.0", path = "pakery-spake2plus" }
pakery-crypto = { version = "0.5.0", path = "pakery-crypto" }
digest = "0.11"
# rand_core 0.10 ships no Cargo features at all, so there is nothing to opt out
# of: it is unconditionally `no_std` and carries no OS-backed generator.
rand_core = "0.10"
# Test-only, workspace-wide: `getrandom::SysRng` is where the OS-backed RNG went
# when rand_core 0.10 dropped `OsRng` along with its features. No published
# crate depends on it — it is a dev-dependency of pakery-crypto and a
# dependency of the publish = false pakery-tests.
getrandom = { version = "0.4", features = ["sys_rng"] }
zeroize = { version = "1.9", features = ["derive"] }
subtle = { version = "2.6", default-features = false }
zeroize_derive = "1.5"
sha2 = "0.11"
# The `group` feature (`group`/`ff` trait impls) has been enabled since the
# first commit but is never used: this crate reaches ristretto255 through
# dalek's own inherent API (`from_uniform_bytes`, `from_bytes_mod_order_wide`,
# `traits::Identity`), never through the `group` traits. Dropping it keeps
# `group` 0.14 and `ff` 0.14 out of the *default* (`ristretto255`) tree.
#
# It does NOT keep them out of a `p256` build: `elliptic-curve` 0.14 pulls
# `group` 0.14 / `ff` 0.14 regardless. Verify with:
#   cargo tree -p pakery-crypto --no-default-features --features std,p256 -d
#
# The second `rand_core` this comment used to warn about is gone: since 0.4.0
# the workspace bound is rand_core 0.10, the same major the whole RustCrypto
# wave is on, so the tree holds one copy rather than two.
curve25519-dalek = { version = "5.0" }
hkdf = "0.13"
hmac = "0.13"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "group-digest"] }
